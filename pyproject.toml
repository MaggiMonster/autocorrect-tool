[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocorrect-tool"
version = "1.0.0"
description = "NLP autocorrect trained on a Shakespearean corpus using Levenshtein distance (dynamic programming) and word-frequency probabilities."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
autocorrect = "autocorrect.cli:main"

[tool.setuptools]
packages = ["autocorrect"]
